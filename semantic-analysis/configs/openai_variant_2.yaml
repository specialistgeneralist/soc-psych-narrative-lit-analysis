seed: 42

paths:
  input_tsv: data/04112025_conceptualised_articles_103_cleaned_normalised_nocounts.csv
  output_dir: outputs
  embeddings_dir: outputs/embeddings
  plots_dir: outputs/plots
  results_dir: outputs/results
  summaries_dir: outputs/summaries
  cache_dir: outputs/cache

models:
  openai_small: text-embedding-3-small
  openai_large: text-embedding-3-large
  anthropic_model: claude-sonnet-4-6
  #anthropic_model: claude-sonnet-4-5-20250929

data:
  text_column: text_normalised
  id_column: uid

use_models:
  - large

metric: euclidean

trimap:
  n_inliers: 10
  n_outliers: 3
  n_random: 3 

hdbscan:
  min_cluster_size: 5
  min_samples: 8
  pca_dim: 2
  metric: euclidean
  selection_method: leaf
  cluster_selection_epsilon: 0.0

  # Supplementary diagnostic only. This does not drive ranking by default.
  silhouette_eval_pca_dim: 20
  silhouette_eval_metric: null

summarization:
  top_k_per_cluster: 10
